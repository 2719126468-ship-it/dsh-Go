name: Custom release (arm64 + arm32, fixed signature)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本名（留空取 app/pubspec.yaml）'
        required: false
        default: ''
      build_arm64:
        description: '构建 arm64（Android 10 手机，含本机 Linux 引擎）'
        required: false
        type: boolean
        default: true
      build_arm32:
        description: '构建 arm32（Android 8.1+ 32 位 ARM，含本机 Linux 引擎）'
        required: false
        type: boolean
        default: true
      publish_release:
        description: '构建成功后发布公开 GitHub Release（默认仅上传构建产物）'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - custom/**

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai
  DSH_MAVEN_MIRRORS: '1'
  EXPECTED_CERT_SHA256: 2501e25fc25fd73baaf3870db4885e486136c175fc739831edfe1fb2a1bc3444

jobs:
  arm64:
    if: github.event_name == 'push' || inputs.build_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: NDK（tawcroot 需要 28.2.13676358）
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          ls "$ANDROID_HOME/ndk"

      - name: 构建内置 Linux 运行时（arm64）
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpgv xz-utils file
          bash runtime/build-runtime.sh arm64-v8a
        env:
          COMPRESS: xz
          XZ_THREADS: 4

      - name: 固定签名
        working-directory: .
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEY_STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > app/android/key.properties
          test -s app/android/key.properties || (echo "key.properties is empty" && exit 1)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 配置 Gradle 镜像（覆盖 Flutter 内置构建）
        working-directory: .
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/00-dsh-maven-mirrors.gradle" <<'GRADLE'
          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
              }
          }
          GRADLE

      - name: 依赖
        run: flutter pub get --enforce-lockfile

      - name: 打包 arm64
        working-directory: .
        run: |
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh -f arm64 ${VERSION:+--build-name "$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
          # tawcroot 是可选启动方式（proot / direct 仍在）；CI 里 NDK 的 Pkg.Revision
          # 与 pin 不完全一致时直接跳过，不让一个可选库挡住出包。
          DSH_SKIP_TAWCROOT: '1'

      - name: 校验签名
        working-directory: .
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm64*release*.apk | head -1)
          echo "APK=$APK"
          SIZE=$(stat -c%s "$APK")
          MAX_APK_BYTES=600000000
          echo "APK size: $SIZE bytes (limit: $MAX_APK_BYTES)"
          (( SIZE <= MAX_APK_BYTES )) || { echo "arm64 APK exceeds 600 MB"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          set +e
          "$APKSIGNER" verify -v --min-sdk-version 21 --print-certs "$APK" | tee verify.txt
          signer_status=${PIPESTATUS[0]}
          set -e
          echo "apksigner exit status: $signer_status (strict scheme/certificate checks follow)"
          grep -qx "Verifies" verify.txt || { cat verify.txt; echo "APK 签名验证未通过"; exit 1; }
          for scheme in v1 v2 v3; do
            grep -Fq "Verified using ${scheme} scheme" verify.txt && grep -Fq "Verified using ${scheme} scheme" verify.txt || { cat verify.txt; echo "${scheme} 签名方案输出缺失"; exit 1; }
            grep -Eq "Verified using ${scheme} scheme.*: true$" verify.txt || { echo "${scheme} 签名方案未通过"; exit 1; }
          done
          if grep -q "CN=Android Debug" verify.txt; then echo "检测到 Android Debug 证书"; exit 1; fi
          actual_cert=$(grep -m1 "certificate SHA-256 digest:" verify.txt | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "actual_cert=$actual_cert"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256" || { echo "签名证书不匹配：$actual_cert"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > badging.txt
          echo "APK badging metadata:"
          cat badging.txt
          grep -q "^package: name='io.github.ccch1mneyyy.dsh_app'" badging.txt || { echo "包名检查失败"; exit 1; }
          "$AAPT" dump xmltree "$APK" --file AndroidManifest.xml > manifest.txt
          grep -Eq 'android:minSdkVersion.*(=26|0x1a)([[:space:]]|$)' manifest.txt || { cat manifest.txt; echo "最低 SDK 检查失败（要求 API 26 / Android 8.0+）"; exit 1; }
          grep -q "^native-code:.*'arm64-v8a'" badging.txt || { echo "arm64 APK ABI 不匹配"; exit 1; }

      - name: 清理密钥
        if: always()
        working-directory: .
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  arm32:
    if: github.event_name == 'push' || inputs.build_arm32
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: 构建 ARMHF 本机运行时
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpgv xz-utils file
          bash runtime/build-runtime.sh armeabi-v7a

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: NDK（与 Gradle 工具链保持一致）
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null

      - name: 固定签名
        working-directory: .
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEY_STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > app/android/key.properties
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 配置 Gradle 镜像（覆盖 Flutter 内置构建）
        working-directory: .
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/00-dsh-maven-mirrors.gradle" <<'GRADLE'
          gradle.settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                  maven { url 'https://maven.aliyun.com/repository/central' }
              }
          }
          gradle.beforeProject { project ->
              project.buildscript.repositories {
                  maven { url 'https://maven.aliyun.com/repository/central' }
                  maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              }
              project.repositories {
                  maven { url 'https://maven.aliyun.com/repository/central' }
              }
          }
          GRADLE

      - name: 依赖
        run: flutter pub get --enforce-lockfile

      - name: 打包 arm32
        working-directory: .
        run: bash tooling/build-apk.sh -f arm32 ${VERSION:+--build-name "$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
          DSH_SKIP_TAWCROOT: '1'

      - name: 校验签名
        working-directory: .
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm32*release*.apk | head -1)
          echo "APK=$APK"
          SIZE=$(stat -c%s "$APK")
          MAX_APK_BYTES=600000000
          echo "APK size: $SIZE bytes (limit: $MAX_APK_BYTES)"
          (( SIZE <= MAX_APK_BYTES )) || { echo "arm32 APK exceeds 600 MB"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          set +e
          "$APKSIGNER" verify -v --min-sdk-version 21 --print-certs "$APK" | tee verify32.txt
          signer_status=${PIPESTATUS[0]}
          set -e
          echo "apksigner exit status: $signer_status (strict scheme/certificate checks follow)"
          grep -qx "Verifies" verify32.txt || { cat verify32.txt; echo "APK 签名验证未通过"; exit 1; }
          for scheme in v1 v2 v3; do
            grep -Fq "Verified using ${scheme} scheme" verify32.txt && grep -Fq "Verified using ${scheme} scheme" verify32.txt || { cat verify32.txt; echo "${scheme} 签名方案输出缺失"; exit 1; }
            grep -Eq "Verified using ${scheme} scheme.*: true$" verify32.txt || { echo "${scheme} 签名方案未通过"; exit 1; }
          done
          if grep -q "CN=Android Debug" verify32.txt; then echo "检测到 Android Debug 证书"; exit 1; fi
          actual_cert=$(grep -m1 "certificate SHA-256 digest:" verify32.txt | sed 's/.*: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "actual_cert=$actual_cert"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256" || { echo "签名证书不匹配：$actual_cert"; exit 1; }
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > badging32.txt
          echo "APK badging metadata:"
          cat badging32.txt
          grep -q "^package: name='io.github.ccch1mneyyy.dsh_app'" badging32.txt || { echo "包名检查失败"; exit 1; }
          "$AAPT" dump xmltree "$APK" --file AndroidManifest.xml > manifest32.txt
          grep -Eq 'android:minSdkVersion.*(=26|0x1a)([[:space:]]|$)' manifest32.txt || { cat manifest32.txt; echo "最低 SDK 检查失败（要求 API 26 / Android 8.0+）"; exit 1; }
          grep -q "^native-code:.*'armeabi-v7a'" badging32.txt || { echo "arm32 APK ABI 不匹配"; exit 1; }

      - name: 清理密钥
        if: always()
        working-directory: .
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-arm32
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  bundle:
    needs: [arm64, arm32]
    if: always() && needs.arm64.result == 'success' && needs.arm32.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: 汇总（重命名 + 校验和）
        run: |
          mkdir -p out
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' app/pubspec.yaml)
          fi
          test -n "$ver" || { echo "无法从 app/pubspec.yaml 读取版本"; exit 1; }
          a64=$(find dist -path '*arm64*' -name '*.apk' | head -1)
          a32=$(find dist -path '*arm32*' -name '*.apk' | head -1)
          [ -z "$a64" ] || cp "$a64" "out/dsh-go-${ver}-arm64.apk"
          [ -z "$a32" ] || cp "$a32" "out/dsh-go-${ver}-arm32.apk"
          cd out && sha256sum *.apk | tee SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks
          path: out/
      - name: 阻止不完整发布
        if: inputs.publish_release && (needs.arm64.result != 'success' || needs.arm32.result != 'success')
        run: echo "::warning::arm64 与 arm32 必须全部成功才允许发布；本次只保留已构建的 artifact。"

      - name: 发布到 Release
        if: inputs.publish_release && needs.arm64.result == 'success' && needs.arm32.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' app/pubspec.yaml)
          fi
          test -n "$ver" || { echo "无法从 app/pubspec.yaml 读取版本"; exit 1; }
          tag="custom-${ver}-$(date -u +%Y%m%d%H%M)"
          {
            echo "破甲预设 + 实用技能 + dsh-our-free-model + 三套皮肤 + 固定签名（v1/v2/v3）。"
            echo
            echo "- arm64：Android 8+ 64 位，含本机 Linux 引擎"
            echo "- arm32：Android 8.1+ 32 位 ARM，本机 Ubuntu armhf + Termux/Bionic Node 24.22.3"
            echo
            echo "证书 SHA-256：2501e25fc25fd73baaf3870db4885e486136c175fc739831edfe1fb2a1bc3444"
          } > notes.md
          gh release create "$tag" out/*.apk out/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "DSH Go 定制版 ${ver}" \
            --notes-file notes.md
