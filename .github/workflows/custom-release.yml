name: Custom release (arm64 + arm32, fixed signature)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本名（留空取 app/pubspec.yaml）'
        required: false
        default: ''
      build_arm64:
        description: '构建 arm64（Android 10 手机，含本机 Linux 引擎）'
        required: false
        type: boolean
        default: true
      build_arm32:
        description: '构建 arm32（Android 8.1 32 位，仅远端客户端）'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - custom/**

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  arm64:
    if: github.event_name == 'push' || inputs.build_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建内置 Linux 运行时（arm64）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpgv xz-utils
          bash runtime/build-runtime.sh arm64-v8a
        env:
          COMPRESS: xz
          XZ_THREADS: 4

      - name: 固定签名
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 打包 arm64
        run: |
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh -f arm64 ${VERSION:+--build-name "$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DSH_KEY_PROPERTIES: app/android/key.properties

      - name: 校验签名
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/app-arm64-release.apk 2>/dev/null || ls app/build/app/outputs/flutter-apk/*arm64*release*.apk | head -1)
          echo "APK=$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify -v --min-sdk-version 21 --print-certs "$APK" | tee /tmp/verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/verify.txt
          ! grep -q "CN=Android Debug" /tmp/verify.txt
          grep -m1 'certificate SHA-256 digest' /tmp/verify.txt || true

      - name: 清理密钥
        if: always()
        run: |
          rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  arm32:
    if: github.event_name == 'push' || inputs.build_arm32
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 固定签名
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 依赖
        working-directory: app
        run: flutter pub get

      - name: 打包 arm32
        run: |
          flutter build apk --release --flavor arm32 --target-platform android-arm \
            --build-number "$(python3 tooling/build_number.py)" \
            ${VERSION:+--build-name "$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 校验签名
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm32*release*.apk | head -1)
          echo "APK=$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify -v --min-sdk-version 21 --print-certs "$APK" | tee /tmp/verify32.txt
          grep -q "Verified using v2 scheme" /tmp/verify32.txt
          ! grep -q "CN=Android Debug" /tmp/verify32.txt
          "$ANDROID_HOME"/build-tools/*/aapt2 dump badging "$APK" | grep -E "native-code|sdkVersion|package:" || true

      - name: 清理密钥
        if: always()
        run: |
          rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm32
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  release:
    needs: [arm64, arm32]
    if: always() && (needs.arm64.result == 'success' || needs.arm32.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 汇总
        run: |
          mkdir -p out
          find dist -name '*.apk' -exec cp {} out/ \;
          cd out && sha256sum *.apk | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/
