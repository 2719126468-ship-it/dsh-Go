name: Custom release (arm64 + arm32, fixed signature)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本名（留空取 app/pubspec.yaml）'
        required: false
        default: ''
      build_arm64:
        description: '构建 arm64（Android 10 手机，含本机 Linux 引擎）'
        required: false
        type: boolean
        default: true
      build_arm32:
        description: '构建 arm32（Android 8.1+ 32 位 ARM，含本机 Linux 引擎）'
        required: false
        type: boolean
        default: true
      publish_release:
        description: '构建成功后发布公开 GitHub Release（默认仅上传构建产物）'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - custom/**

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  arm64:
    if: github.event_name == 'push' || inputs.build_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: NDK（tawcroot 需要 28.2.13676358）
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          ls "$ANDROID_HOME/ndk"

      - name: 构建内置 Linux 运行时（arm64）
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpgv xz-utils file
          bash runtime/build-runtime.sh arm64-v8a
        env:
          COMPRESS: xz
          XZ_THREADS: 4

      - name: 固定签名
        working-directory: .
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEY_STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > app/android/key.properties
          test -s app/android/key.properties || (echo "key.properties is empty" && exit 1)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 依赖
        run: flutter pub get

      - name: 打包 arm64
        working-directory: .
        run: |
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh -f arm64 ${VERSION:+--build-name "$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
          # tawcroot 是可选启动方式（proot / direct 仍在）；CI 里 NDK 的 Pkg.Revision
          # 与 pin 不完全一致时直接跳过，不让一个可选库挡住出包。
          DSH_SKIP_TAWCROOT: '1'

      - name: 校验签名
        working-directory: .
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm64*release*.apk | head -1)
          echo "APK=$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify -v --min-sdk-version 21 --print-certs "$APK" | tee verify.txt
          grep -q "Verified using v1 scheme (JAR signing): true" verify.txt
          grep -q "Verified using v2 scheme" verify.txt
          grep -q "Verified using v3 scheme" verify.txt
          ! grep -q "CN=Android Debug" verify.txt

      - name: 清理密钥
        if: always()
        working-directory: .
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  arm32:
    if: github.event_name == 'push' || inputs.build_arm32
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 构建 ARMHF 本机运行时
        working-directory: .
        run: |
          sudo apt-get install -y -qq gpgv xz-utils file
          bash runtime/build-runtime.sh armeabi-v7a

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 固定签名
        working-directory: .
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEY_STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > app/android/key.properties
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 依赖
        run: flutter pub get

      - name: 打包 arm32
        working-directory: .
        run: tooling/build-apk.sh -f arm32 ${VERSION:+--build-name "$VERSION"}
        env:
          VERSION: ${{ inputs.version }}
          DSH_SKIP_TAWCROOT: '1'

      - name: 校验签名
        working-directory: .
        run: |
          APK=$(ls app/build/app/outputs/flutter-apk/*arm32*release*.apk | head -1)
          echo "APK=$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify -v --min-sdk-version 21 --print-certs "$APK" | tee verify32.txt
          grep -q "Verified using v2 scheme" verify32.txt
          ! grep -q "CN=Android Debug" verify32.txt
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "native-code|sdkVersion|package:" || true

      - name: 清理密钥
        if: always()
        working-directory: .
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm32
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  bundle:
    needs: [arm64, arm32]
    if: always() && (needs.arm64.result == 'success' || needs.arm32.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 汇总（重命名 + 校验和）
        run: |
          mkdir -p out
          ver="${{ inputs.version }}"
          [ -n "$ver" ] || ver=1.0.16
          a64=$(find dist -path '*arm64*' -name '*.apk' | head -1)
          a32=$(find dist -path '*arm32*' -name '*.apk' | head -1)
          [ -z "$a64" ] || cp "$a64" "out/dsh-go-${ver}-arm64.apk"
          [ -z "$a32" ] || cp "$a32" "out/dsh-go-${ver}-arm32.apk"
          cd out && sha256sum *.apk | tee SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/
      - name: 发布到 Release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${{ inputs.version }}"
          [ -n "$ver" ] || ver=1.0.16
          tag="custom-${ver}-$(date -u +%Y%m%d%H%M)"
          {
            echo "破甲预设 + 实用技能 + dsh-our-free-model + 三套皮肤 + 固定签名（v1/v2/v3）。"
            echo
            echo "- arm64：Android 8+ 64 位，含本机 Linux 引擎"
            echo "- arm32：Android 8.1+ 32 位 ARM，本机 Ubuntu armhf + Termux/Bionic Node 24.22.3"
            echo
            echo "证书 SHA-256：2501e25fc25fd73baaf3870db4885e486136c175fc739831edfe1fb2a1bc3444"
          } > notes.md
          gh release create "$tag" out/*.apk out/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --title "DSH Go 定制版 ${ver}" \
            --notes-file notes.md
