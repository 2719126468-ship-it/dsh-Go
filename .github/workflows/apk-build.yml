# 在 GitHub runner 上编 APK，产物以 artifact 交付。
#
# 本工作流只编 debug/profile 包：不做签名、不嵌内测通道令牌、不要求任何 secret，
# 因此 fork、PR、本地克隆都能直接跑。带固定签名的正式包走 custom-release.yml。
#
#   PR：改动 app / runtime / tooling / sdk / packages 时自动跑一次 arm64 debug 包。
#   手动：workflow_dispatch 可选 flavor 与 mode。
name: APK build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - 'runtime/**'
      - 'sdk/**'
      - 'tooling/**'
      - '.github/workflows/apk-build.yml'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'APK flavor（arm64 手机 / x64 模拟器 / arm32 无本机运行时）'
        required: true
        default: arm64
        type: choice
        options: [arm64, x64, arm32]
      mode:
        description: '构建类型（debug 不需要运行时产物，profile 同 debug）'
        required: true
        default: debug
        type: choice
        options: [debug, profile]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  apk:
    name: APK ${{ inputs.flavor || 'arm64' }} ${{ inputs.mode || 'debug' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DSH_MAVEN_MIRRORS: 0 # Aliyun 镜像从 US runner 上又慢又不稳
      DSH_BETA_TOKEN_FILE: '' # 不嵌内测通道令牌
      DSH_SKIP_TAWCROOT: '1' # tawcroot 是可选启动方式，别让 NDK 版本漂移挡住出包
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter 依赖与 local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: 编译 APK
        run: |
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh --${{ inputs.mode || 'debug' }} -f ${{ inputs.flavor || 'arm64' }}

      - name: 校验产物
        id: apk
        run: |
          apk=$(ls app/build/app/outputs/flutter-apk/*-${{ inputs.mode || 'debug' }}.apk | head -1)
          test -s "$apk" || { echo "没有产出 APK" && exit 1; }
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"
          aapt2=$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apksigner=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          {
            echo "### APK"
            echo
            echo "$apk"
            echo
            echo '```'
            "$aapt2" dump badging "$apk" | grep -E "^package:|^sdkVersion|^native-code" || true
            "$apksigner" verify --print-certs "$apk" | head -6 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk-${{ inputs.flavor || 'arm64' }}-${{ inputs.mode || 'debug' }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 7
