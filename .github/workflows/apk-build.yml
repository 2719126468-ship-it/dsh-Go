# 在 GitHub runner 上编 APK，产物以 artifact 交付。
#
# 本工作流只编 debug/profile 包：使用 Gradle debug keystore，不使用固定发布密钥，
# 不嵌内测通道令牌、不要求 secret，因此 fork、PR、本地克隆都能直接跑。
# 带固定签名的正式包走 custom-release.yml。
#
#   PR：同时构建 arm64 与 arm32 debug 包，并分别验证 APK ABI。
#   手动：workflow_dispatch 可选 flavor 与 mode。
name: APK build

on:
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - 'runtime/**'
      - 'sdk/**'
      - 'tooling/**'
      - '.github/workflows/apk-build.yml'
  push:
    branches:
      - 'feat/**'
    paths:
      - 'app/**'
      - 'packages/**'
      - 'runtime/**'
      - 'sdk/**'
      - 'tooling/**'
      - '.github/workflows/apk-build.yml'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'APK flavor（arm64 手机 / x64 模拟器 / arm32 32 位手机）'
        required: true
        default: arm64
        type: choice
        options: [arm64, x64, arm32]
      mode:
        description: '构建类型（debug/profile 使用 Gradle debug 签名）'
        required: true
        default: debug
        type: choice
        options: [debug, profile]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai

jobs:
  apk:
    name: APK ${{ matrix.flavor }} ${{ inputs.mode || 'debug' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ (github.event_name == 'pull_request') && fromJSON('["arm64","arm32"]') || fromJSON(format('["{0}"]', inputs.flavor || 'arm64')) }}
    env:
      DSH_MAVEN_MIRRORS: 0 # Aliyun 镜像从 US runner 上又慢又不稳
      DSH_BETA_TOKEN_FILE: '' # 不嵌内测通道令牌
      DSH_SKIP_TAWCROOT: '1' # tawcroot 是可选启动方式，别让 NDK 版本漂移挡住出包
    steps:
      # 与 ci.yml 同一组钉死版本：仓库不接受浮动的 action 标签。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建 ARM64 本机运行时
        if: matrix.flavor == 'arm64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gpgv xz-utils file
          chmod +x runtime/build-runtime.sh
          COMPRESS=xz bash runtime/build-runtime.sh arm64-v8a

      - name: Flutter 依赖与 local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: 编译 APK
        run: |
          chmod +x tooling/build-apk.sh
          tooling/build-apk.sh --${{ inputs.mode || 'debug' }} -f ${{ matrix.flavor }}

      - name: 校验产物
        id: apk
        run: |
          apk=$(find app/build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*-${{ matrix.flavor }}-${{ inputs.mode || 'debug' }}.apk' | sort | tail -1)
          test -s "$apk" || { echo "没有产出 ${{ matrix.flavor }} APK" && exit 1; }
          size_bytes=$(stat -c%s "$apk")
          max_apk_bytes=600000000
          echo "APK size: $size_bytes bytes (limit: $max_apk_bytes)"
          (( size_bytes <= max_apk_bytes )) || { echo "APK exceeds 600 MB"; exit 1; }
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          ls -lh "$apk"
          aapt2=$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          apksigner=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$aapt2" dump badging "$apk" > badging.txt
          case "${{ matrix.flavor }}" in
            arm64) expected_abi=arm64-v8a ;;
            arm32) expected_abi=armeabi-v7a ;;
            x64) expected_abi=x86_64 ;;
          esac
          grep -q "^package: name=" badging.txt
          grep -q "^native-code:.*'$expected_abi'" badging.txt || { cat badging.txt; echo "APK ABI 不匹配：期望 $expected_abi"; exit 1; }
          "$apksigner" verify -v --print-certs "$apk" > verify.txt
          grep -q "Verified using v2 scheme.*: true" verify.txt || { cat verify.txt; exit 1; }
          {
            echo "### APK ABI 与签名校验"
            echo
            echo "$apk（$expected_abi）"
            echo
            echo '```'
            grep -E "^package:|^sdkVersion|^native-code" badging.txt
            grep -E "Verified using v[123] scheme|Signer #1 certificate SHA-256" verify.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-apk-${{ matrix.flavor }}-${{ inputs.mode || 'debug' }}
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 7
