# A PR runs what it touches; a push to main runs everything, which also catches
# whatever the path filters below miss. `CI OK` is the one result to look at.
# External PRs are closed by pr-gate.yml and spend no runner here.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
      packages: ${{ github.event_name != 'pull_request' || steps.filter.outputs.packages == 'true' }}
      runtime: ${{ github.event_name != 'pull_request' || steps.filter.outputs.runtime == 'true' }}
      codex: ${{ github.event_name != 'pull_request' || steps.filter.outputs.codex == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # The paths outside each area's own are files its tests read.
          # runtime/** includes shipped unified-diff patches; runtime tests parse and apply every hunk.
          filters: |
            ci: &ci .github/workflows/ci.yml
            app: [*ci, 'app/**', 'packages/**', 'sdk/plugin-kit/**', 'site/share/**', 'docs/guide/**', 'THIRD_PARTY_NOTICES.md']
            packages: [*ci, 'packages/**']
            runtime: [*ci, 'runtime/**', 'examples/**', 'sdk/plugin-kit/**', 'app/tool/engine_auth/**', 'app/test/plugin_config/fixtures/**', 'app/test/media/fixtures/**']
            # Codex suite is independently tested and is not bundled into the APK.
            codex: [*ci, 'services/codex-web/**', 'services/sharedchat-bridge/**', 'packages/dsh-codex-delegate/**', 'tooling/codex-capture/**']

  checks:
    name: Generated files, tooling, SDK, web
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generated files are in sync
        run: |
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
          node sdk/plugin-kit/scripts/sync-skill.mjs --check
          # Not --check: this also writes site/build/share, which the share worker builds from.
          python3 app/tool/make_replay_viewer.py
          git diff --exit-code -- app/lib/share_code/replay_viewer.g.dart
      - name: Python tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q Pillow==13.0.0 numpy==2.4.0
          for dir in tooling runtime/tests app/tool; do
            "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s "$dir" -p 'test_*.py'
          done
      - name: Plugin SDK
        working-directory: sdk/plugin-kit
        run: |
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm test
      - name: Market, sites, share worker
        run: |
          (cd market && npm ci --ignore-scripts --no-audit --no-fund && npm test)
          (cd site/home && npm run check && npm run check:content && npm test)
          (cd services/share-worker && npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm run typecheck && npm test)
          node --test site/share/test/viewer_test.mjs

  flutter:
    name: Flutter ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
    defaults:
      run:
        working-directory: app
    steps:
      - *checkout
      - *node
      - &flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The goldens have Noto Color Emoji 2.051; Ubuntu's 2.047 draws the glyphs differently.
      - name: Install the fonts the goldens were drawn with
        timeout-minutes: 20
        run: |
          # The goldens require the base and extra Noto CJK font collections.
          # Bound apt retries/timeouts so slow hosted-runner mirrors cannot stall a shard.
          sudo apt-get update -q -o Acquire::http::Timeout=90 -o Acquire::https::Timeout=90 -o Acquire::Retries=2
          sudo apt-get install -yq -o Acquire::http::Timeout=90 -o Acquire::https::Timeout=90 -o Acquire::Retries=2 fonts-noto-cjk=1:20230817+repack1-3 fonts-noto-cjk-extra=1:20230817+repack1-3
          curl -fsSL --connect-timeout 20 --max-time 120 --retry 3 --retry-all-errors -o "$RUNNER_TEMP/emoji.ttf" https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $RUNNER_TEMP/emoji.ttf" | sha256sum -c -
          sudo install -Dm644 "$RUNNER_TEMP/emoji.ttf" /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter pub get --enforce-lockfile
      - name: Analyze, and generated localization matches its source
        if: matrix.shard == 0
        run: |
          flutter analyze --no-pub
          python3 tool/l10n_merge.py
          git diff --exit-code -- lib/l10n
      # Split by file, not with --total-shards: that still compiles every file on every shard.
      - name: Test every third file
        run: flutter test --no-pub --concurrency=4 --reporter github $(find test -name '*_test.dart' | sort | awk 'NR % 3 == ${{ matrix.shard }}')
      - name: Keep golden diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures-${{ matrix.shard }}
          path: app/test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

  dart:
    name: Dart packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn # The registry these two lockfiles were resolved from.
    steps:
      - *checkout
      - *flutter
      - run: |
          for pkg in packages/dsh_client packages/dsh_remote; do
            (cd "$pkg" && dart pub get --enforce-lockfile && dart analyze && dart test)
          done

  runtime:
    name: Runtime and bridge
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      UV_USE_IO_URING: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - *node
      - name: Generate pinned ARM DSH lockfiles
        run: |
          version=$(sed -nE 's/^DSH_VERSION="\$\{DSH_VERSION:-(.+)\}"$/\1/p' runtime/build-runtime.sh)
          out="$RUNNER_TEMP/dsh-locks"
          mkdir -p "$out/dsh-$version" "$out/dsh-$version-android"
          npm install --prefix "$out/dsh-$version" --cpu=arm64 --os=linux --libc=glibc --ignore-scripts --no-audit --no-fund --save-exact "@deepseek-ai/dsh@$version" "@liustack/modsearch@5.10.12" "dsh-context@0.84.1"
          mapfile -t hoist < <(python3 -I runtime/lib/rtbuild.py hoist-candidates "$out/dsh-$version/package-lock.json")
          if [[ ${#hoist[@]} -gt 0 ]]; then
            npm install --prefix "$out/dsh-$version" --cpu=arm64 --os=linux --libc=glibc --ignore-scripts --no-audit --no-fund --save-exact "@deepseek-ai/dsh@$version" "@liustack/modsearch@5.10.12" "dsh-context@0.84.1" "${hoist[@]}"
          fi
          npm install --prefix "$out/dsh-$version-android" --cpu=arm --os=linux --libc=android --ignore-scripts --no-audit --no-fund --save-exact "@deepseek-ai/dsh@$version"
          test -s "$out/dsh-$version/package-lock.json"
          test -s "$out/dsh-$version-android/package-lock.json"
      - name: Upload generated DSH lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-arm-lockfiles
          path: |
            ${{ runner.temp }}/dsh-locks/dsh-*/package.json
            ${{ runner.temp }}/dsh-locks/dsh-*/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Install a throwaway patched DSH
        run: |
          version=$(sed -nE 's/^DSH_VERSION="\$\{DSH_VERSION:-(.+)\}"$/\1/p' runtime/build-runtime.sh)
          prefix="$RUNNER_TEMP/dsh"
          mkdir "$prefix"
          lockdir="$RUNNER_TEMP/dsh-locks/dsh-$version"
          cp "$lockdir/package.json" "$lockdir/package-lock.json" "$prefix/"
          npm ci --prefix "$prefix" --ignore-scripts --no-audit --no-fund
          echo '--- run-tree ---'
          grep -n -A14 -B6 'function treeAlive' "$prefix/node_modules/@deepseek-ai/dsh-plugin-manager/lib/types/run-tree.js" || true
          echo '--- operations activeRecordedRun / preflight / child / warning repair ---'
          for pattern in 'async function activeRecordedRun' 'preflight.length' 'const child = execa' 'cancelSignal:' 'warnings.length > 0' 'const repairing = execa'; do
            grep -n -A34 -B10 "$pattern" "$prefix/node_modules/@deepseek-ai/dsh-plugin-manager/lib/types/operations.js" | head -n 80 || true
          done
          echo '--- manager install/change ---'
          grep -n -A24 -B10 'stage: "install"' "$prefix/node_modules/@deepseek-ai/dsh-plugin-manager/lib/index.js" | head -n 65 || true
          grep -n -A30 -B8 'async change(' "$prefix/node_modules/@deepseek-ai/dsh-plugin-manager/lib/index.js" | head -n 75 || true
          echo '--- registry retry / restoreFiles block ---'
          grep -n -A28 -B10 'for (const \\[index, registry\\]' "$prefix/node_modules/@deepseek-ai/dsh-plugin-manager/lib/index.js" | head -n 90 || true
          grep -n -A18 -B8 'restoreFiles(files)' "$prefix/node_modules/@deepseek-ai/dsh-plugin-manager/lib/index.js" | head -n 90 || true
          echo '--- bundled index warning-repair path ---'
          grep -n -A55 -B12 'warnings.length > 0' "$prefix/node_modules/@deepseek-ai/dsh-plugin-manager/lib/index.js" | head -n 95 || true
          cp "$prefix/node_modules/@deepseek-ai/dsh-fs-local/lib/index.js" "$prefix/fs-local-original.js"
          python3 -I runtime/lib/rtbuild.py patch-dsh --prefix "$prefix" --dsh-version "$version" --record
          python3 -I runtime/lib/preinstall_optional_bundles.py --prefix "$prefix" --manifest runtime/preinstalled-bundles.json
          cat runtime/patches/pins.json
          {
            echo "DSH_PREFIX=$prefix"
            echo "DSH_TEST_PREFIX=$prefix"
            echo "DSH_INSTALL=$prefix/node_modules/@deepseek-ai/dsh"
            echo "DSH_TOOLS_DIR=$prefix/node_modules/@deepseek-ai/dsh-tools"
          echo "DSH_VERSION=$version"
            echo "DSH_FS_LOCAL_ORIGINAL_JS=$prefix/fs-local-original.js"
          } >> "$GITHUB_ENV"
      - name: Unit tests
        run: |
          manager="$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/dsh-plugin-manager/lib/index.js"
          if ! node --check "$manager"; then
            sed -n '875,905p' "$manager"
            exit 1
          fi
          DSH_PREFIX="$DSH_PREFIX" node --test runtime/tests/*.test.mjs app/tool/engine_auth/*.test.mjs
          python3 -I runtime/tests/test_patch_dsh.py
          python3 -I runtime/tests/test_preinstall_optional_bundles.py
      - name: Capture patched DSH files for patch review
        if: failure()
        run: |
          debug="$RUNNER_TEMP/dsh-patch-debug"
          mkdir -p "$debug"
          for package in dsh-agent-default-model dsh-agent-loop dsh-api-session-controller dsh-app-boot dsh-client-file-upload dsh-config-editor dsh-fs-local dsh-home-paths dsh-host-webserver dsh-official-bundles dsh-plugin-manager dsh-sandbox dsh-sandbox-local dsh-fs-sandbox dsh-bash-sandbox dsh-pwsh-sandbox dsh-sandbox-policy dsh-sandbox-windows-acl dsh-schedule dsh-session dsh-session-persistence-jsonl dsh-session-projection-cache dsh-session-query dsh-session-query-sqlite dsh-skill-filesystem dsh-storage-domain dsh-storage-json dsh-subprocess-local dsh-tool-schedule dsh-workspace; do
            source="$RUNNER_TEMP/dsh/node_modules/@deepseek-ai/$package/lib/index.js"
            if [[ -f "$source" ]]; then cp "$source" "$debug/$package-index.js"; fi
          done
          for package in @liustack/modsearch dsh-context; do
            source="$RUNNER_TEMP/dsh/node_modules/$package/package.json"
            if [[ -f "$source" ]]; then
              safe_name=$(printf '%s' "$package" | tr '/@' '--')
              cp "$source" "$debug/$safe_name-package.json"
            fi
          done
          cp runtime/patches/*.diff "$debug/" || true
          cp runtime/patches/pins.json "$debug/"
      - name: Upload patched DSH patch review files
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-patch-review
          path: ${{ runner.temp }}/dsh-patch-debug/
          if-no-files-found: error
          retention-days: 3
      - name: Media and example plugins
        run: |
          (cd runtime/media/dsh-media && npm install --ignore-scripts --no-package-lock --no-audit --no-fund && npm test)
          for plugin in examples/plugins/dsh-go-example-*/; do
            (cd "$plugin" && npm test && npm run check)
          done
      - name: Route guard and native bridge against a real host
        run: |
          bash runtime/tests/run-guard-tests.sh "$DSH_PREFIX" --guard bridge
          bash runtime/tests/run-native-tests.sh "$DSH_PREFIX"
      - name: Commit verified DSH locks and patch pins
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^DSH_VERSION="\$\{DSH_VERSION:-(.+)\}"$/\1/p' runtime/build-runtime.sh)
          for suffix in "" "-android"; do
            source="$RUNNER_TEMP/dsh-locks/dsh-$version$suffix"
            target="runtime/locks/dsh-$version$suffix"
            mkdir -p "$target"
            cp "$source/package.json" "$source/package-lock.json" "$target/"
          done
          git add runtime/locks/dsh-"$version" runtime/locks/dsh-"$version"-android runtime/patches/pins.json
          if git diff --cached --quiet; then
            echo "Runtime locks and verified patch pins are already current."
            exit 0
          fi
          # PR workflows check out a synthetic merge commit. Commit generated pins
          # on the actual PR head in a detached worktree, not on that merge ref.
          branch_dir="$RUNNER_TEMP/pr-head"
          git fetch origin "refs/heads/$GITHUB_HEAD_REF"
          git worktree add --detach "$branch_dir" FETCH_HEAD
          cp runtime/patches/pins.json "$branch_dir/runtime/patches/pins.json"
          for suffix in "" "-android"; do
            source="$RUNNER_TEMP/dsh-locks/dsh-$version$suffix"
            target="$branch_dir/runtime/locks/dsh-$version$suffix"
            mkdir -p "$target"
            cp "$source/package.json" "$source/package-lock.json" "$target/"
          done
          git -C "$branch_dir" add runtime/patches/pins.json runtime/locks/dsh-"$version" runtime/locks/dsh-"$version"-android
          if git -C "$branch_dir" diff --cached --quiet; then
            echo "Runtime locks and verified patch pins are already current."
            exit 0
          fi
          git -C "$branch_dir" config user.name "github-actions[bot]"
          git -C "$branch_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$branch_dir" commit -m "Pin DSH $version runtime dependencies and patches"
          git -C "$branch_dir" push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          curl --fail --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$GITHUB_HEAD_REF\"}"

  codex:
    name: Codex suite
    needs: changes
    if: needs.changes.outputs.codex == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - *checkout
      - *node
      # public/*.js 是浏览器脚本，tools/*.src.js 是被注入页面的片段（含顶层 return），
      # 两者只做真实执行验证（npm test），不做 node --check。
      - name: Web Codex unit tests
        working-directory: services/codex-web
        run: |
          for file in server.js src/*.js; do node --check "$file"; done
          npm test
      - name: OpenAI-compatible bridge compiles
        run: |
          python3 -m py_compile services/sharedchat-bridge/bridge.py
          for file in services/sharedchat-bridge/*.sh; do bash -n "$file"; done
      - name: Delegate plugin parses and cancellation tests
        run: |
          for file in packages/dsh-codex-delegate/index.js packages/dsh-codex-delegate/src/*.js packages/dsh-codex-delegate/test/*.js; do
            node --check "$file"
          done
          node --test packages/dsh-codex-delegate/test/*.test.js
      - name: Capture probes parse
        run: |
          for file in tooling/codex-capture/*.py; do python3 -m py_compile "$file"; done
          for file in tooling/codex-capture/*.sh; do bash -n "$file"; done


  android:
    name: Android JVM
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_MAVEN_MIRRORS: 0 # The Aliyun mirrors are slow and unreliable from a US runner.
    steps:
      - *checkout
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - *flutter
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      # gradlew is not tracked, so Gradle comes from here. The two flavors differ only in ABI.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - working-directory: app/android
        run: gradle --stacktrace :app:testArm64DebugUnitTest

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, checks, flutter, dart, runtime, codex, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
